                check(TLAdapterForBundle(@"/Library/PreferenceBundles/XHelloKbAIPrefs.bundle") == NULL, "R1: XHelloKbAIPrefs.bundle no longer matches");
                check(TLAdapterForBundle(@"/nowhere/TotallyDifferent.bundle") == NULL, "R1: unrelated bundle no match");
                check(TLAdapterForBundle(@"/Library/PreferenceBundles/Snapper3Preferences.bundle") == NULL, "unregistered no-lproj bundle skipped");
                check(TLAdapterForBundle(nil) == NULL, "nil path safe");
                check(TLAdapterForBundle(@"") == NULL, "empty path safe");
                check(TLAdapterForBundle(@"/Library/PreferenceBundles/") == NULL, "no directory component safe");
                check(TLAdapterForBundle(@"/Library/PreferenceBundles/.bundle") == NULL, ".bundle alone safe");
                NSString *marker = TLAdapterImageMarker(hello);
                check([marker isEqualToString:@"/HelloKbAIPrefs.bundle/"], "marker derived from bundleName");
                check(TLAdapterImageMarker(NULL) == nil, "TLAdapterImageMarker(NULL) safe");
                for (NSUInteger i = 0; i < count; i++) check(table[i].bundleName != NULL && table[i].languages != NULL && table[i].languageCount > 0, "table entry well-formed");
            } printf("\n%s (%d failure(s))\n", failures==0?"ALL
            PASS":"FAILURES", failures); return failures==0?0:1; }

            TLTESTEOF

