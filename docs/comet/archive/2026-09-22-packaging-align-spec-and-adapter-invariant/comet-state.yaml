            static int failures = 0;

            static void check(BOOL c, const char *w){ printf("%s %s\n",
            c?"ok  ":"FAIL", w); if(!c) failures++; }

            int main(void){ @autoreleasepool{
                NSUInteger count = 0; const TLAdapterEntry *table = TLAdapterTable(&count);
                const TLAdapterEntry *hello = &table[0];
                check(count == 1, "registry has exactly one entry");
                check(hello->languages != NULL && hello->languageCount == 2, "languageCount is 2");
                check(TLAdapterForBundle(@"/var/jb/Library/PreferenceBundles/HelloKbAIPrefs.bundle") == hello, "exact directory name matches");
                check(TLAdapterForBundle(@"/var/containers/Bundle/Application/U/.jbroot-1/Library/PreferenceBundles/HelloKbAIPrefs.bundle") == hello, "roothide .jbroot path matches");
